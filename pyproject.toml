[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talk2g"
version = "0.1.0"
description = "Local, progressive Russian voice typing for Linux and Windows"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2,<3",
  "onnx-asr[cpu]==0.12.0",
  "soundfile>=0.13,<1",
  "scipy>=1.13,<2",
  "websockets==15.0.1",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "sounddevice>=0.5,<1", "python-xlib>=0.33,<1; sys_platform == 'linux'", "dbus-next==0.2.3; sys_platform == 'linux'"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-qt>=4,<5", "ruff>=0.12,<1", "pyinstaller>=6,<7"]

[project.scripts]
talk2g = "talk2g.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/talk2g"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_model: requires downloaded GigaAM weights", "desktop: requires an interactive desktop"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
