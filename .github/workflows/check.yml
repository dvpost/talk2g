name: checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libportaudio2 desktop-file-utils
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.25'
          python-version: '3.12'
      - run: uv sync --frozen --extra desktop --extra dev
      - run: uv run ruff check src tests benchmarks packaging
      - run: uv run ruff format --check src tests benchmarks packaging
      - run: uv run pytest -q
